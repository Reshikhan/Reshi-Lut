<div class="wrap">
  <header>

  </div>

  <div class="card" id="studio" hidden>
    <div id="pvWrap">
      <canvas id="gl"></canvas>
      <span class="splab" id="labB">BEFORE</span>
      <span class="splab" id="labA">AFTER</span>
      <div id="divider"><div id="divLine"></div><div id="divHandle">◀▶</div></div>
      <div id="renderOverlay" hidden><div class="roBox"><div class="roPct" id="roPct">0%</div><div class="roTxt">Rendering your video…<br>keep this tab open</div></div></div>
    </div>
    <button class="ghostbtn" id="splitBtn" style="margin-top:10px">⇄ Before / After: ON</button>
    <div class="trow">

        <svg id="icoPlay" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icoPause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
    </div>

    <h2>My LUTs</h2>
    <div id="lutGrid"></div>
    <input type="file" id="lutIn" accept=".cube,.CUBE" multiple hidden>
    <p class="hint" id="lutHint">Your LUTs stay saved on this device</p>

    <div class="srow">
      <label for="int">Strength</label>
      <input type="range" id="int" min="0" max="100" value="100">
      <label id="intVal">100%</label>
    </div>

    <h2>Export</h2>
    <div class="srow"><label for="resSel">Size</label>
      <select id="resSel">
        <option value="orig">Original</option>
        <option value="1080">1080p</option>
        <option value="1440">2K (1440p)</option>
        <option value="2160">4K (2160p)</option>
      </select>
    </div>
    <div class="srow"><label for="fpsSel">FPS</label>
      <select id="fpsSel">
        <option value="orig">Original</option>
        <option value="24">24</option>
        <option value="25">25</option>
        <option value="30">30</option>
        <option value="50">50</option>
        <option value="60">60</option>
      </select>
    </div>
    <div class="srow"><label for="qSel">Quality</label>
      <select id="qSel">
        <option value="max">Maximum</option>
        <option value="high" selected>High</option>
        <option value="bal">Balanced</option>
        <option value="small">Smaller file</option>
      </select>
    </div>
    <div class="srow"><label for="fmtSel">Format</label>
      <select id="fmtSel">
        <option value="mp4">MP4 (H.264)</option>
        <option value="hevc">HEVC (H.265)</option>
      </select>
    </div>
    <p id="sumLine"></p>
    <button class="bigbtn" id="expBtn" style="margin-top:12px">⬇ Save graded video</button>
    <div id="prog" hidden><div id="bar"></div></div>
    <div id="dlZone"></div>
    <p id="msg"></p>
  </div>
<p style="text-align:center;color:#a0a6c0;font-size:.7rem;margin-top:24px">v2.3</p>
</div>

function selectLUT(id){
  active=id;
  if(id==='__orig'){hasLUT=false; if(glReady)gl.uniform1f(U.useLUT,0);}
  else{const f=luts.find(l=>l.name===id); if(f&&glReady)uploadLUT(f.lut);}
  renderLuts();
}
function removeLUT(name){
  const i=luts.findIndex(l=>l.name===name);
  if(i>=0)luts.splice(i,1);
  DB.del(name);
  if(active===name)selectLUT('__orig'); else renderLuts();
}
async function addLUTFiles(files){
  let ok=0;
  for(const f of files){
    try{
      const txt=await f.text();
      const lut=parseCube(txt);
      const name=f.name;
      const i=luts.findIndex(l=>l.name===name);
      const rec={name,lut};
      if(i>=0)luts[i]=rec; else luts.push(rec);
      DB.put({name,text:txt});
      ok++;
    }catch(e){msg('Skipped '+f.name+': not a valid .cube','err');}
  }
  if(ok){selectLUT(luts[luts.length-1].name); msg(ok+' LUT'+(ok>1?'s':'')+' added ✓','ok');}
  renderLuts();
}

function qualityBps(){
  const mult={max:1,high:0.7,bal:0.45,small:0.25}[$('qSel').value]||0.7;
  const base=origBps>0?origBps:8000000;
  let bps=Math.max(800000,Math.round(base*mult-128000)); // leave room for audio
  // Cap for smooth mobile playback: origBps from phones can be 50-80 Mbps,
  // which stutters/freezes on Android decoders. Caps raised for quality —
  // 4K needs ~40M to avoid grain/artifacts, still decodable on modern phones.
  const h=exportSize()[1];
  const cap=h>=2160?40e6:h>=1440?25e6:h>=1080?15e6:h>=720?8e6:5e6;
  return Math.min(bps,cap);
}
function exportSize(){
  const vw=videoEl.videoWidth, vh=videoEl.videoHeight, t=$('resSel').value;
  if(t==='orig')return[vw,vh];
  const s=(+t)/Math.min(vw,vh);
  let w=Math.round(vw*s), h=Math.round(vh*s);
  return [w-(w%2), h-(h%2)];
}

}

/* ============================================================
   EXPORT — WebCodecs pipeline (primary for MP4/H.264)
   Video: VideoFrame(canvas) -> VideoEncoder(H.264, exact bitrate)
          -> mp4-muxer. Audio: MediaStreamTrackProcessor ->
          AudioEncoder(AAC) -> mp4-muxer. Precise timestamps,
          no more bitrate guessing, AAC audio plays on iPhone.
   ============================================================ */
function canUseWebCodecs(){
  try{
    return typeof VideoEncoder!=='undefined'&&typeof VideoFrame!=='undefined'
      &&typeof AudioEncoder!=='undefined'&&typeof MediaStreamTrackProcessor!=='undefined'
      &&!!(window.Mp4Muxer&&window.Mp4Muxer.Muxer);
  }catch(e){return false;}
}
async function pickAvcCodec(w,h){
  // Use max dimension so portrait (e.g. 1080x1920) gets the same level as landscape 1920x1080.
  // Old code checked w/h separately and gave portrait 1080p Level 5.1 (4K tier),
  // which Android hardware encoders reject -> "encoder error".
  // Prefer Baseline (42) over High (64): universally supported, negligible quality diff for LUT work.
  const m=Math.max(w,h);
  const lvl=m<=1280?'1f':m<=1920?'28':m<=2560?'32':'33';
  for(const c of ['avc1.4200'+lvl,'avc1.6400'+lvl]){
    try{
      const s=await VideoEncoder.isConfigSupported({codec:c,width:w,height:h,bitrate:2e6,framerate:30});
      if(s&&s.supported)return c;
    }catch(e){}
  }
  return 'avc1.420028'; // Baseline Level 4.0: safest universal fallback
}
function seekTo(t){
  return new Promise(res=>{
    if(Math.abs(videoEl.currentTime-t)<0.04){res();return;}
    const to=setTimeout(res,1500);
    videoEl.addEventListener('seeked',()=>{clearTimeout(to);res();},{once:true});
    try{videoEl.currentTime=t;}catch(e){clearTimeout(to);res();}
  });
}
/* ============================================================
   OFFLINE EXPORT — frame-by-frame, not real-time.
   Seeks through the video and encodes each frame with exact timestamps.
   Slower than real-time but bulletproof: output is smooth on any device,
   regardless of encoder speed. Audio decoded directly from the file.
   ============================================================ */
async function exportOffline(resW,resH,targetFps,videoBps){
  let muxer=null,target=null,videoEnc=null,audioEnc=null;
  let done=false,finalized=false;
  const fail=e=>{ if(done)return; done=true; cleanup(); throw(e instanceof Error?e:new Error(String(e))); };
  const cleanup=()=>{ try{videoEl.pause();}catch(e){} };

  // Detect FPS if "Original" — default 30
  let fps=targetFps||30;
  const frameDurUs=Math.round(1e6/fps);
  const duration=videoEl.duration;
  const totalFrames=Math.ceil(duration*fps);

  holdWake();
  $('prog').hidden=false; setProg(0);
  msg('🔄 Offline rendering (frame-by-frame)… 0%');

  try{
    // --- decode audio from file ---
    let audioBuf=null;
    if(videoFile){
      try{
        const ab=await videoFile.arrayBuffer();
        const AC=window.AudioContext||window.webkitAudioContext;
        const actx=new AC();
        audioBuf=await actx.decodeAudioData(ab);
        actx.close();
      }catch(e){ audioBuf=null; }
    }

    // --- muxer ---
    target=new window.Mp4Muxer.ArrayBufferTarget();
    const mopts={target,
      video:{codec:'avc',width:resW,height:resH},
      fastStart:'in-memory',
      firstTimestampBehavior:'offset'};
    let wantAudio=false, aSampleRate=0, aChannels=0;
    if(audioBuf){
      aSampleRate=audioBuf.sampleRate; aChannels=audioBuf.numberOfChannels;
      try{
        const s=await AudioEncoder.isConfigSupported({codec:'mp4a.40.2',sampleRate:aSampleRate,numberOfChannels:aChannels,bitrate:128000});
        if(s&&s.supported){ mopts.audio={codec:'aac',sampleRate:aSampleRate,numberOfChannels:aChannels}; wantAudio=true; }
      }catch(e){}
    }
    muxer=new window.Mp4Muxer.Muxer(mopts);

    // --- video encoder ---
    const codec=await pickAvcCodec(resW,resH);
    videoEnc=new VideoEncoder({
      output:(ch,meta)=>{ if(!finalized){try{muxer.addVideoChunk(ch,meta);}catch(e){fail(e);}} },
      error:fail
    });
    videoEnc.configure({codec,width:resW,height:resH,
      bitrate:Math.max(800000,Math.round(videoBps)),bitrateMode:'constant',
      framerate:fps, latencyMode:'realtime'});

    // --- audio encoder: feed PCM chunks ---
    if(wantAudio){
      audioEnc=new AudioEncoder({
        output:(ch,meta)=>{ if(!finalized){try{muxer.addAudioChunk(ch,meta);}catch(e){}} },
        error:()=>{}
      });
      audioEnc.configure({codec:'mp4a.40.2',sampleRate:aSampleRate,numberOfChannels:aChannels,bitrate:128000});
      const nCh=aChannels, sr=aSampleRate, len=audioBuf.length;
      const perChunk=1024;
      const chData=[];
      for(let c=0;c<nCh;c++) chData.push(audioBuf.getChannelData(c));
      for(let off=0; off<len; off+=perChunk){
        if(done)break;
        const n=Math.min(perChunk, len-off);
        const inter=new Float32Array(n*nCh);
        for(let c=0;c<nCh;c++){ const src=chData[c]; for(let i=0;i<n;i++) inter[i*nCh+c]=src[off+i]; }
        const ad=new AudioData({format:'f32',sampleRate:sr,numberOfFrames:n,numberOfChannels:nCh,
          timestamp:Math.round(off/sr*1e6), data:inter});
        audioEnc.encode(ad); ad.close();
      }
      await audioEnc.flush();
    }

    // --- video: seek frame by frame ---
    canvas.width=resW; canvas.height=resH;
    wcActive=true;
    videoEl.pause();
    const kfEvery=Math.max(1,Math.round(fps));
    let frames=0;
    // Wait for a freshly presented frame after seek (guarantees correct image)
    const waitFrame=()=>new Promise(res=>{
      const to=setTimeout(res,800);
      try{
        videoEl.requestVideoFrameCallback(()=>{clearTimeout(to);res();});
      }catch(e){ clearTimeout(to); setTimeout(res,120); }
    });
    const seekExact=t=>new Promise(res=>{
      const to=setTimeout(()=>{res();},2500);
      videoEl.onseeked=()=>{clearTimeout(to);res();};
      try{ videoEl.currentTime=t; }catch(e){ clearTimeout(to); res(); }
    });
    for(let i=0;i<totalFrames;i++){
      if(done)break;
      const t=i/fps;
      if(t>=duration)break;
      await seekExact(t);
      await waitFrame(); // ensure the sought frame is actually displayed
      draw();
      const ts=Math.round(t*1e6);
      const vf=new VideoFrame(canvas,{timestamp:ts,duration:frameDurUs});
      videoEnc.encode(vf,{keyFrame:frames%kfEvery===0});
      vf.close(); frames++;
      const p=Math.min(1,(i+1)/totalFrames);
      setProg(p*100);
      msg('🔄 Offline rendering '+Math.round(p*100)+'% (frame '+(i+1)+'/'+totalFrames+')');
      if(i%10===0) await new Promise(r=>setTimeout(r,0));
    }
    await videoEnc.flush();

    let blob=null;
    finalized=true; muxer.finalize();
    blob=new Blob([target.buffer],{type:'video/mp4'});
    cleanup();
    if(!blob||!blob.size) throw new Error('encoder produced no data');
    return blob;
  }catch(e){ cleanup(); throw e; }
}
async function exportWebCodecs(resW,resH,targetFps,videoBps){
  let muxer=null,target=null,videoEnc=null,audioEnc=null,audioReader=null,probeTracks=[];
  let done=false,finalized=false,wl=null,capTimer=null,playWatch=null,stallTimer=null;
  const d=videoEl.duration, maxPlausible=origSize>0?(origSize*8/100000):7200;
  const saneDur=(isFinite(d)&&d>0)?Math.min(d,maxPlausible):Math.min(60,maxPlausible);
  const capMs=saneDur*1000+20000, t0=Date.now();
  const holdWake=()=>{try{navigator.wakeLock.request('screen').then(w=>{wl=w;}).catch(()=>{});}catch(e){}};
  const cleanup=()=>{
    document.removeEventListener('visibilitychange',onHide);
    wcActive=false;
    try{if(wl)wl.release();}catch(e){}
    if(capTimer)clearTimeout(capTimer);
    if(playWatch)clearTimeout(playWatch);
    if(stallTimer)clearInterval(stallTimer);
    try{if(audioReader)audioReader.cancel();}catch(e){}
    probeTracks.forEach(t=>{try{t.stop();}catch(e){}});
    try{if(videoEnc&&videoEnc.state!=='closed')videoEnc.close();}catch(e){}
    try{if(audioEnc&&audioEnc.state!=='closed')audioEnc.close();}catch(e){}
  };
  const onHide=()=>{ if(!done) fail(new Error('Tab was hidden — export stopped. Keep this tab open and try again.')); };

  return new Promise(async(resolve,reject)=>{
    const fail=e=>{ if(done)return; done=true; cleanup(); reject(e instanceof Error?e:new Error(String(e))); };
    const finish=async()=>{
      if(done)return; done=true;
      try{videoEl.pause();}catch(e){}
      try{if(audioReader)await audioReader.cancel();}catch(e){}
      try{await videoEnc.flush();}catch(e){}
      try{if(audioEnc)await audioEnc.flush();}catch(e){}
      let blob=null;
      try{ finalized=true; muxer.finalize(); blob=new Blob([target.buffer],{type:'video/mp4'}); }
      catch(e){ cleanup(); reject(e); return; }
      cleanup();
      if(!blob||!blob.size){ reject(new Error('encoder produced no data')); return; }
      resolve(blob);
    };

    try{
      holdWake();
      document.addEventListener('visibilitychange',onHide);
      $('prog').hidden=false; setProg(0);
      msg('📌 Keep this tab open until done… 0%');

      /* --- audio probe: play briefly, read one AudioData for its format --- */
      let aSampleRate=0,aChannels=0,hasAudioTrack=false;
      try{
        videoEl.pause(); await seekTo(0);
        const ps=videoEl.captureStream(), pt=ps.getAudioTracks();
        hasAudioTrack=pt.length>0;
        if(hasAudioTrack){
          probeTracks=pt;
          await videoEl.play().catch(()=>{});
          const proc=new MediaStreamTrackProcessor({track:pt[0]});
          const pr=proc.readable.getReader();
          const rr=await Promise.race([pr.read(),new Promise(res=>setTimeout(()=>res(null),2000))]);
          try{pr.cancel();}catch(e){}
          if(rr&&rr.value){ aSampleRate=rr.value.sampleRate; aChannels=rr.value.numberOfChannels; try{rr.value.close();}catch(e){} }
          else if(pt[0].getSettings){
            const st=pt[0].getSettings();
            aSampleRate=st.sampleRate||48000; aChannels=st.channelCount||2;
          }
        }
      }catch(e){}
      probeTracks.forEach(t=>{try{t.stop();}catch(e){}}); probeTracks=[];
      videoEl.pause();

      /* --- muxer --- */
      target=new window.Mp4Muxer.ArrayBufferTarget();
      const mopts={target,
        video:{codec:'avc',width:resW,height:resH},
        fastStart:'in-memory',
        firstTimestampBehavior:'offset'}; // 'offset' rebases EACH track to 0 (audio comes from capture clock, video from mediaTime — 'cross-track-offset' kept audio's late start, stretching duration)
      const wantAudio=hasAudioTrack&&aSampleRate>0;
      if(wantAudio){
        // AAC-in-MP4 is what plays on iPhone; if this browser can't encode AAC,
        // bail to the legacy path (its MediaRecorder uses the browser's native AAC).
        let aacOK=false;
        try{
          const s=await AudioEncoder.isConfigSupported({codec:'mp4a.40.2',sampleRate:aSampleRate,numberOfChannels:aChannels,bitrate:128000});
          aacOK=!!(s&&s.supported);
        }catch(e){}
        if(!aacOK)throw new Error('no AAC encoder in this browser');
        mopts.audio={codec:'aac',sampleRate:aSampleRate,numberOfChannels:aChannels};
      }
      muxer=new window.Mp4Muxer.Muxer(mopts);

      /* --- video encoder: exact bitrate, H.264 --- */
      const codec=await pickAvcCodec(resW,resH);
      videoEnc=new VideoEncoder({
        output:(ch,meta)=>{ if(!finalized){try{muxer.addVideoChunk(ch,meta);}catch(e){fail(e);}} },
        error:fail
      });
      videoEnc.configure({codec,width:resW,height:resH,
        bitrate:Math.max(800000,Math.round(videoBps)),bitrateMode:'constant',
        framerate:targetFps>0?targetFps:30});

      /* --- audio encoder: AAC (plays on iPhone, unlike Opus-in-MP4) --- */
      const pumpAudio=async()=>{
        try{
          while(true){
            const r=await audioReader.read();
            if(!r||r.done)break;
            try{if(audioEnc.state==='configured')audioEnc.encode(r.value);}catch(e){}
            try{r.value.close();}catch(e){}
          }
        }catch(e){}
      };
      const startAudio=()=>{
        try{
          const s=videoEl.captureStream(), ts=s.getAudioTracks();
          if(!ts.length)return;
          const proc=new MediaStreamTrackProcessor({track:ts[0]});
          audioReader=proc.readable.getReader();
          pumpAudio();
        }catch(e){}
      };

      /* --- capture loop: frame-count timestamps (perfectly regular, immune to source stutter) --- */
      await seekTo(0);
      canvas.width=resW; canvas.height=resH;
      wcActive=true; // rAF loop stands down; onFrame drives draw() explicitly
      // Fast: use selected FPS or 30 default (no detection delay)
      let outFps=targetFps||30;
      const frameDurUs=Math.round(1e6/outFps);
      const kfEvery=Math.max(1,Math.round(outFps));
      let frames=0,lastTick=Date.now(),warmup=0;
      const useRVFC=typeof videoEl.requestVideoFrameCallback==='function';
      // Clear to black so no garbage memory ever gets encoded
      gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);

      const onFrame=(now,meta)=>{
        if(done)return;
        if(document.hidden){fail(new Error('Tab was hidden — export stopped. Keep this tab open and try again.'));return;}
        try{
          // Warmup: draw 3 frames without encoding to let decoder stabilize.
          // This prevents corrupted garbage frames at the start of output.
          if(warmup<3){
            warmup++;
            draw();
            if(useRVFC)videoEl.requestVideoFrameCallback(onFrame);
            return;
          }
          const mediaUs=Math.round(meta.mediaTime*1e6);
          // Fixed timestep: only encode when source has advanced past next output timestamp.
          // Output timestamps are perfectly regular (i/fps), immune to source stutter.
          const targetTs=frames*frameDurUs;
          if(mediaUs<targetTs){
            if(useRVFC)videoEl.requestVideoFrameCallback(onFrame);
            return;
          }
          const ts=targetTs;
          // Backpressure: if encoder is behind, PAUSE video until it catches up
          // (no frames dropped, no gaps - just takes longer; A/V stays in sync)
          if(videoEnc.encodeQueueSize>100){
            videoEl.pause();
            msg('Encoder catching up... '+Math.round(ts/1e6/d*100)+'%');
            const drain=async()=>{
              while(videoEnc.encodeQueueSize>20&&!done){
                await new Promise(r=>setTimeout(r,120));
              }
              if(!done){
                try{ await videoEl.play(); }catch(e){}
                if(useRVFC)videoEl.requestVideoFrameCallback(onFrame);
              }
            };
            drain();
            return;
          }
          draw();
          const vf=new VideoFrame(canvas,{timestamp:ts,duration:frameDurUs});
          videoEnc.encode(vf,{keyFrame:frames%kfEvery===0});
          vf.close(); frames++;
          lastTick=Date.now();
          if(isFinite(d)&&d>0){
            const p=Math.min(1,ts/1e6/d);
            setProg(p*100);
            msg('Rendering H.264 '+(videoBps/1e6).toFixed(1)+' Mbps… '+Math.round(p*100)+'%');
          }
        }catch(e){fail(e);return;}
        if(Date.now()-t0>capMs){finish();return;}
        if(useRVFC)videoEl.requestVideoFrameCallback(onFrame);
      };

      videoEl.onended=()=>finish();
      capTimer=setTimeout(()=>finish(),capMs);
      stallTimer=setInterval(()=>{
        if(done||Date.now()-lastTick<=6000)return;
        finish(); // stalled: no frames for 6s
      },1000);

      if(wantAudio){
        audioEnc=new AudioEncoder({
          output:(ch,meta)=>{ if(!finalized){try{muxer.addAudioChunk(ch,meta);}catch(e){}} },
          error:()=>{}
        });
        audioEnc.configure({codec:'mp4a.40.2',sampleRate:aSampleRate,numberOfChannels:aChannels,bitrate:128000});
      }
      try{
        await videoEl.play();
        startAudio();
        if(useRVFC)videoEl.requestVideoFrameCallback(onFrame);
        else{const step=()=>{if(done)return;onFrame(performance.now(),{mediaTime:videoEl.currentTime});if(!done)requestAnimationFrame(step);};requestAnimationFrame(step);}
        playWatch=setTimeout(()=>{if(!done&&videoEl.paused)fail(new Error('playback did not start'));},8000);
      }catch(e){fail(e);}
    }catch(e){fail(e);}
  });
}

/* ============================================================
   LEGACY EXPORT (MediaRecorder) — fallback + HEVC path.
   v1.11 logic: pause-on-hide, wake lock, guaranteed settle.
   ============================================================ */
let safAC=null,safSrc=null;
function exportAudio(){
  try{
    if(typeof videoEl.captureStream==='function'){
      const s=videoEl.captureStream();
      const ts=s.getAudioTracks();
      if(ts.length)return{tracks:ts,stop:()=>{try{s.getTracks().forEach(t=>t.stop())}catch(e){}}};
    }
  }catch(e){}
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return{tracks:[],stop:()=>{}};
    if(!safAC){
      safAC=new AC(); if(safAC.state==='suspended')safAC.resume();
      safSrc=safAC.createMediaElementSource(videoEl);
      safSrc.connect(safAC.destination);
    }
    const dest=safAC.createMediaStreamDestination();
    safSrc.connect(dest);
    return{tracks:dest.stream.getAudioTracks(),stop:()=>{try{safSrc.disconnect(dest)}catch(e){}}};
  }catch(e){return{tracks:[],stop:()=>{}};}
}
function encCandidates(fmt){
  const mp4=[['video/mp4','mp4','MP4']];
  const hevc=[['video/mp4;codecs=hvc1','mp4','HEVC'],['video/mp4;codecs=hev1','mp4','HEVC']];
  const h264w=[['video/webm;codecs=h264','webm','WebM']];
  const webm=[['video/webm;codecs=vp9','webm','WebM'],['video/webm;codecs=vp8','webm','WebM'],['video/webm','webm','WebM']];
  const list=fmt==='hevc'?[...hevc,...mp4,...h264w,...webm]:[...mp4,...h264w,...webm];
  return list.filter(([m])=>{try{return window.MediaRecorder&&MediaRecorder.isTypeSupported(m)}catch(e){return false}});
}
function renderPass(stream,mime,bps,resW,resH,saneDur){
  return new Promise((resolve,reject)=>{
    const chunks=[];
    let rec=null, done=false, settled=false, hidden=false, hideT=0, pausedMs=0;
    let wl=null, capTimer=null, playWatch=null;
    const t0=Date.now(), capMs=saneDur*1000+10000;
    const holdWake=()=>{ try{ navigator.wakeLock.request('screen').then(w=>{wl=w;}).catch(()=>{}); }catch(e){} };
    const cleanup=()=>{ document.removeEventListener('visibilitychange',onVis);
      try{if(wl)wl.release();}catch(e){}
      if(capTimer){clearTimeout(capTimer);capTimer=null;}
      if(playWatch){clearTimeout(playWatch);playWatch=null;} };
    const settle=v=>{ if(settled)return; settled=true; cleanup(); resolve(v); };
    const finish=()=>{ if(done)return; done=true;
      try{ if(rec&&rec.state==='recording')rec.stop(); }catch(e){}
      setTimeout(()=>settle(chunks),500); };
    const fail=e=>{ if(done)return; done=true; cleanup(); reject(e); };
    const onVis=()=>{
      if(done||!rec)return;
      if(document.hidden){ hidden=true; hideT=Date.now(); try{rec.pause();}catch(e){} videoEl.pause(); msg('⏸ Paused — come back to this tab to continue…'); }
      else{ if(hidden){ hidden=false; pausedMs+=Date.now()-hideT; try{rec.resume();}catch(e){} videoEl.play().catch(()=>{}); } holdWake(); }
    };
    let lastT=-1,lastMove=Date.now();
    const tick=()=>{
      if(done||hidden||!rec)return;
      const t=videoEl.currentTime;
      if(t>lastT+0.002){lastT=t;lastMove=Date.now();}
      msg('Rendering… '+Math.round(Math.min(t,saneDur)/saneDur*100)+'%');
      setProg(Math.min(t,saneDur)/saneDur*100);
      if(Date.now()-t0-pausedMs>capMs)finish();
      else if(isFinite(videoEl.duration)&&videoEl.duration>0&&t>=videoEl.duration-0.05)finish();
      else if(t>0.5&&Date.now()-lastMove>3000)finish();
    };
    try{ rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:bps}); }
    catch(e){ fail(e); return; }
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    rec.onstop=()=>settle(chunks);
    rec.onerror=()=>fail(new Error('encoder error'));
    document.addEventListener('visibilitychange',onVis);
    videoEl.addEventListener('timeupdate',tick);
    videoEl.onended=finish;
    holdWake();
    msg('📌 Keep this tab open until done… 0%');
    $('prog').hidden=false; setProg(0);
    canvas.width=resW; canvas.height=resH;
    capTimer=setTimeout(()=>finish(),capMs);
    try{ rec.start(250); }catch(e){ fail(e); return; }
    try{
      Promise.resolve(videoEl.play()).then(()=>{
        playWatch=setTimeout(()=>{ if(!done&&!hidden&&videoEl.paused) fail(new Error('playback did not start')); },8000);
      }).catch(fail);
    }catch(e){ fail(e); return; }
  });
}
async function exportLegacy(){
  videoEl.pause();
  if(videoEl.currentTime>0.05||videoEl.ended){
    await new Promise(res=>{
      const to=setTimeout(res,1500);
      videoEl.addEventListener('seeked',()=>{clearTimeout(to);res();},{once:true});
      try{videoEl.currentTime=0;}catch(e){clearTimeout(to);res();}
    });
  }
  const [resW,resH]=exportSize();
  const bps=qualityBps()+128000;
  const fmt=$('fmtSel').value;
  const d=videoEl.duration, maxPlausible=origSize>0?(origSize*8/100000):7200;
  const saneDur=(isFinite(d)&&d>0)?Math.min(d,maxPlausible):Math.min(60,maxPlausible);
  const cands=encCandidates(fmt);
  if(!cands.length)throw new Error('no video encoder in this browser');
  const expectedMin=origSize>0?origSize*0.6:0;
  let blob=null, ext='mp4', lab=fmt==='hevc'?'HEVC':'MP4', best=null;
  for(const [mime,e,l] of cands){
    const aud=exportAudio();
    const stream=new MediaStream([...canvas.captureStream(60).getVideoTracks(),...aud.tracks]);
    let chunks=[];
    try{ chunks=await renderPass(stream,mime,bps,resW,resH,saneDur); }
    finally{ try{aud.stop();}catch(_){} try{stream.getTracks().forEach(t=>t.stop());}catch(_){} }
    videoEl.pause();
    const b=new Blob(chunks,{type:mime.split(';')[0]});
    if(b.size&&(!best||b.size>best.blob.size))best={blob:b,ext:e,lab:l};
    if(expectedMin>0&&b.size>=expectedMin){blob=b;ext=e;lab=l;break;}
    if(!expectedMin&&b.size){blob=b;ext=e;lab=l;break;}
    msg(l+' came out too small — trying a better encoder…');
  }
  if(!blob){ if(!best)throw new Error('encoder produced no data'); blob=best.blob;ext=best.ext;lab=best.lab; }
  return {blob,ext,lab};
}

/* ---------- export button: WebCodecs first, legacy fallback ---------- */
$('expBtn').onclick=async()=>{
  if(exporting||!videoEl.videoWidth)return;
  exporting=true; $('expBtn').disabled=true; $('dlZone').innerHTML='';
  $('renderOverlay').hidden=false; setProg(0);
  try{
    const [resW,resH]=exportSize();
    const fmt=$('fmtSel').value;
    const fps=$('fpsSel').value==='orig'?0:+$('fpsSel').value;
    const bps=qualityBps();
    let blob=null, ext='mp4', lab='MP4';
    if(fmt==='mp4'&&canUseWebCodecs()){
      try{
        msg('⚡ Rendering (auto-pauses if encoder lags)…');
        blob=await exportWebCodecs(resW,resH,fps,bps);
        lab='MP4';
      }catch(e){
        msg('Fast render failed ('+e.message+') — trying offline…');
        try{
          blob=await exportOffline(resW,resH,fps,bps);
          lab='MP4';
        }catch(e2){
          const r=await exportLegacy();
          blob=r.blob; ext=r.ext; lab=r.lab;
        }
      }
    }else{
      const r=await exportLegacy();
      blob=r.blob; ext=r.ext; lab=r.lab;
    }
    const mb=(blob.size/1048576).toFixed(1);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='reshi-graded-'+resW+'x'+resH+'-'+Date.now()+'.'+ext;
    a.className='dl';
    a.textContent='⬇ Download '+lab+' '+resW+'×'+resH+' ('+mb+' MB)';
    $('dlZone').appendChild(a); a.click();
    // Post-export options: render again or start new video
    const opts=document.createElement('div');
    opts.style.cssText='display:flex;gap:10px;margin-top:12px';
    opts.innerHTML=
      '<button class="ghostbtn" id="reRenderBtn" style="margin-top:0;flex:1">🔄 Render again</button>'+
      '<button class="ghostbtn" id="newVidBtn" style="margin-top:0;flex:1">📤 New video</button>';
    $('dlZone').appendChild(opts);
    $('reRenderBtn').onclick=()=>{ $('dlZone').innerHTML=''; $('expBtn').click(); };
    $('newVidBtn').onclick=()=>{ $('dlZone').innerHTML=''; $('uploadCard').hidden=false; $('studio').hidden=true; if(videoEl.src)URL.revokeObjectURL(videoEl.src); videoEl.removeAttribute('src'); videoEl.load(); };
    msg('Done — '+lab+' '+resW+'×'+resH+' saved ✓ ('+mb+' MB)','ok');
  }catch(e){
    const em=e.message||String(e);
    let hint='';
    if(/encoder|encode|codec|mime/i.test(em)) hint=' — try Size: 1080p or Format: HEVC';
    msg('Export failed: '+em+hint,'err');
  }
  exporting=false; $('expBtn').disabled=false; videoEl.onended=null;
  $('renderOverlay').hidden=true;
};



/* Default LUTs: fetched from luts/ folder on first run */
const DEFAULT_LUT_FILES=[
  'Cine_wedding.cube','Cinematic_Lut_V2.cube','SONY_HL.cube',
  'Sony-CL-AZ.cube','FGCineVibrant.cube',
  'sony_lut_1.Animals_09___4K_res.cube','lut_1.rabbit-5639615.cube','Apple-Log_XZ1.cube'
];
async function loadDefaultLuts(){
  for(const fname of DEFAULT_LUT_FILES){
    try{
      const name=fname.replace(/\.cube$/i,'');
      if(luts.some(l=>l.name===name||l.name===fname)) continue;
      const resp=await fetch('luts/'+fname);
      if(!resp.ok) continue;
      const text=await resp.text();
      const lut=parseCube(text);
      luts.push({name:fname,lut:lut});
      try{ if(typeof DB!=='undefined'&&DB) DB.put({name:fname,text:text}); }catch(e){}
    }catch(e){}
  }
  renderLuts();
}
/* ---------- restore saved LUTs ---------- */
(async()=>{
  renderLuts();
  if(await DB.open()){
    const saved=await DB.all();
    for(const s of saved){
      try{luts.push({name:s.name,lut:parseCube(s.text)});}catch(e){DB.del(s.name);}
    }
    if(luts.length)renderLuts();
  }else{
    $('lutHint').textContent='LUTs work for this session on this device';
  }
  // Load built-in default LUTs (first run)
  loadDefaultLuts();
})();
