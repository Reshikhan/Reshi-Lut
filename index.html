<script>
'use strict';
const $=id=>document.getElementById(id);
const videoEl=$('v'), canvas=$('gl');
const msg=(t,cls)=>{ const m=$('msg'); m.textContent=t||''; m.className=cls||''; };
const setProg=p=>{p=Math.max(0,Math.min(100,p));$('bar').style.width=p+'%';const r=$('roPct');if(r)r.textContent=Math.round(p)+'%';};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- saved LUTs (stay on the device) ---------- */
const DB={
  db:null,
  open(){return new Promise(res=>{try{
    const r=indexedDB.open('reshi-lut-studio',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('luts',{keyPath:'name'});
    r.onsuccess=()=>{DB.db=r.result;res(true)}; r.onerror=()=>res(false);
  }catch(e){res(false)}})},
  all(){return new Promise(res=>{try{
    const t=DB.db.transaction('luts').objectStore('luts').getAll();
    t.onsuccess=()=>res(t.result||[]); t.onerror=()=>res([]);
  }catch(e){res([])}})},
  put(it){try{DB.db.transaction('luts','readwrite').objectStore('luts').put(it)}catch(e){}},
  del(n){try{DB.db.transaction('luts','readwrite').objectStore('luts').delete(n)}catch(e){}}
};

/* ---------- .cube parsing ---------- */
function parseCube(txt){
  const lines=txt.split(/\r?\n/);
  let n=0; const data=[];
  for(let ln of lines){
    ln=ln.trim();
    if(!ln||ln[0]==='#') continue;
    const p=ln.split(/\s+/), k=p[0].toUpperCase();
    if(k==='LUT_3D_SIZE'){ n=parseInt(p[1],10); if(!(n>=2&&n<=64)) throw new Error('bad size'); }
    else if(k==='TITLE'||k==='DOMAIN_MIN'||k==='DOMAIN_MAX'||k==='LUT_1D_SIZE') continue;
    else{
      if(!n) throw new Error('not a 3D LUT');
      const v=p.slice(0,3).map(Number);
      if(v.length<3||v.some(isNaN)) continue;
      data.push(v[0],v[1],v[2]);
    }
  }
  if(!n||data.length<n*n*n*3) throw new Error('incomplete LUT');
  return {n, data:Float32Array.from(data)};
}

/* ---------- WebGL preview (with before/after split) ---------- */
let gl, texV, texL, U={}, glReady=false, hasLUT=false;
let intensity=1, active='__orig', origBps=0, origSize=0, videoFile=null;
let splitPos=0.5, splitOn=true, exporting=false, wcActive=false;
const luts=[]; // {name, lut}

function initGL(){
  gl=canvas.getContext('webgl',{antialias:false,preserveDrawingBuffer:true});
  if(!gl) throw new Error('WebGL not available on this device');
  const vs='attribute vec2 p; varying vec2 uv; void main(){uv=p*0.5+0.5; gl_Position=vec4(p,0.,1.);}';
  const fs=['precision mediump float; varying vec2 uv;',
    'uniform sampler2D videoTex,lutTex; uniform float lutN,intensity,useLUT,bypass,splitX;',
    'vec3 applyLUT(vec3 c){',
    ' vec3 s=clamp(c,0.,1.)*(lutN-1.);',
    ' float b0=floor(s.b),b1=min(b0+1.,lutN-1.);',
    ' vec2 tsz=vec2(lutN,lutN*lutN);',
    ' vec3 c0=texture2D(lutTex,(vec2(s.r,s.g+b0*lutN)+.5)/tsz).rgb;',
    ' vec3 c1=texture2D(lutTex,(vec2(s.r,s.g+b1*lutN)+.5)/tsz).rgb;',
    ' return mix(c0,c1,fract(s.b));}',
    'void main(){ vec3 c=texture2D(videoTex,vec2(uv.x,1.-uv.y)).rgb;',
    ' vec3 g=useLUT>.5?applyLUT(c):c;',
    ' vec3 fin=mix(c,g,intensity*(1.-bypass));',
    ' if(splitX>=0.){ fin=mix(fin,c,step(uv.x,splitX)); }', // left = BEFORE
    ' gl_FragColor=vec4(fin,1.);}'].join('\n');
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error('shader: '+gl.getShaderInfoLog(o));return o};
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) throw new Error('GL link failed');
  gl.useProgram(pr);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const mkTex=()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t};
  texV=mkTex(); texL=mkTex();
  gl.uniform1i(gl.getUniformLocation(pr,'videoTex'),0);
  gl.uniform1i(gl.getUniformLocation(pr,'lutTex'),1);
  ['lutN','intensity','useLUT','bypass','splitX'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
  gl.uniform1f(U.intensity,1); gl.uniform1f(U.useLUT,0); gl.uniform1f(U.bypass,0); gl.uniform1f(U.splitX,0.5);
  glReady=true;
  (function loop(){ try{ if(!wcActive) draw(); }catch(e){} requestAnimationFrame(loop); })();
}
function uploadLUT(lut){
  const n=lut.n, bytes=new Uint8Array(n*n*n*4);
  const d=lut.data;
  for(let i=0;i<n*n*n;i++){
    bytes[i*4]=Math.max(0,Math.min(255,Math.round(d[i*3]*255)));
    bytes[i*4+1]=Math.max(0,Math.min(255,Math.round(d[i*3+1]*255)));
    bytes[i*4+2]=Math.max(0,Math.min(255,Math.round(d[i*3+2]*255)));
    bytes[i*4+3]=255;
  }
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,texL);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,n,n*n,0,gl.RGBA,gl.UNSIGNED_BYTE,bytes);
  gl.uniform1f(U.lutN,n); gl.uniform1f(U.useLUT,1); hasLUT=true;
}
function draw(){
  if(!glReady||!videoEl.videoWidth) return;
  if(!exporting&&(canvas.width!==videoEl.videoWidth||canvas.height!==videoEl.videoHeight)){
    canvas.width=videoEl.videoWidth; canvas.height=videoEl.videoHeight;
  }
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,texV);
  try{gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,videoEl);}catch(e){return;}
  gl.uniform1f(U.intensity,intensity);
  gl.uniform1f(U.bypass,0);
  gl.uniform1f(U.splitX,(splitOn&&!exporting)?splitPos:-1);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.flush();
}

/* ---------- LUT thumbnails (tiny CPU preview per LUT) ---------- */
function lutPx(ld,n,r,g,b){
  r=Math.min(1,Math.max(0,r))*(n-1); g=Math.min(1,Math.max(0,g))*(n-1); b=Math.min(1,Math.max(0,b))*(n-1);
  const x0=Math.floor(r),y0=Math.floor(g),z0=Math.floor(b);
  const x1=Math.min(n-1,x0+1),y1=Math.min(n-1,y0+1),z1=Math.min(n-1,z0+1);
  const fx=r-x0,fy=g-y0,fz=b-z0;
  const at=(x,y,z)=>{const o=((z*n+y)*n+x)*3;return[ld[o],ld[o+1],ld[o+2]];};
  const c000=at(x0,y0,z0),c100=at(x1,y0,z0),c010=at(x0,y1,z0),c110=at(x1,y1,z0);
  const c001=at(x0,y0,z1),c101=at(x1,y0,z1),c011=at(x0,y1,z1),c111=at(x1,y1,z1);
  const mix2=(a,b2,t)=>a+(b2-a)*t;
  const out=[0,0,0];
  for(let i=0;i<3;i++){
    const x00=mix2(c000[i],c100[i],fx),x10=mix2(c010[i],c110[i],fx);
    const x01=mix2(c001[i],c101[i],fx),x11=mix2(c011[i],c111[i],fx);
    out[i]=mix2(mix2(x00,x10,fy),mix2(x01,x11,fy),fz);
  }
  return [out[0]*255,out[1]*255,out[2]*255];
}
function paintThumb(cv,lut){
  const W=120, H=videoEl.videoWidth?Math.max(2,Math.round(120*videoEl.videoHeight/videoEl.videoWidth)):68;
  cv.width=W; cv.height=H;

  try{cx.drawImage(videoEl,0,0,W,H);}catch(e){return;}
  if(!lut) return;
  try{
    const img=cx.getImageData(0,0,W,H), dd=img.data, ld=lut.data, n=lut.n;
    for(let i=0;i<dd.length;i+=4){
      const o=lutPx(ld,n,dd[i]/255,dd[i+1]/255,dd[i+2]/255);
      dd[i]=o[0]; dd[i+1]=o[1]; dd[i+2]=o[2];
    }
    cx.putImageData(img,0,0);
  }catch(e){}
}

function qualityBps(){
  const mult={max:1,high:0.7,bal:0.45,small:0.25}[$('qSel').value]||0.7;
  const base=origBps>0?origBps:8000000;
  let bps=Math.max(800000,Math.round(base*mult-128000)); // leave room for audio
  // Cap for smooth mobile playback: origBps from phones can be 50-80 Mbps,
  // which stutters/freezes on Android decoders. Caps raised for quality —
  // 4K needs ~40M to avoid grain/artifacts, still decodable on modern phones.
  const h=exportSize()[1];
  const cap=h>=2160?40e6:h>=1440?25e6:h>=1080?15e6:h>=720?8e6:5e6;
  return Math.min(bps,cap);
}

/* ============================================================
   EXPORT ENGINE v3 — VideoDecoder-based (Android / PC)
   Replaces the fragile <video>-element frame source:
     MP4 file -> mp4box demux (exact per-sample timestamps)
       -> VideoDecoder (no playback clock, no seeking)
       -> WebGL LUT shader -> VideoEncoder (exact timestamps)
       -> mp4-muxer.
   Decode runs in a pump; frames are consumed in PRESENTATION
   order (B-frame safe). Always uses original timing — if the
   user picks a custom fps, the button routes to the old engine.
   iPhone keeps its existing path unchanged (isIOS gate).
   Falls back to the old engines on any error.
   ============================================================ */
function isIOS(){
  try{
    const ua=navigator.userAgent||'';
    return /iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  }catch(e){return false;}
}
function canUseDecoderEngine(){
  try{
    return !isIOS()
      && typeof VideoDecoder!=='undefined'
      && typeof EncodedVideoChunk!=='undefined'
      && typeof MP4Box!=='undefined'
      && canUseWebCodecs();
  }catch(e){return false;}
}
/* Rebuild the avcC box payload (no 8-byte box header) from mp4box's
   parsed fields — this is the VideoDecoder `description`. */
function buildAvcCDesc(avcC){
  const nb=e=>((e&&e.nalu instanceof Uint8Array)?e.nalu:Uint8Array.from((e&&e.nalu)||[]));
  const sps=(avcC.SPS||[]).map(nb), pps=(avcC.PPS||[]).map(nb);
  let len=7;
  sps.forEach(s=>len+=2+s.length); pps.forEach(p=>len+=2+p.length);
  const out=new Uint8Array(len), dv=new DataView(out.buffer);
  let o=0;
  out[o++]=avcC.configurationVersion&255;
  out[o++]=avcC.AVCProfileIndication&255;
  out[o++]=avcC.profile_compatibility&255;
  out[o++]=avcC.AVCLevelIndication&255;
  out[o++]=0xFC|((avcC.lengthSizeMinusOne||3)&3);
  out[o++]=0xE0|(sps.length&31);
  sps.forEach(s=>{ dv.setUint16(o,s.length); o+=2; out.set(s,o); o+=s.length; });
  out[o++]=pps.length&255;
  pps.forEach(p=>{ dv.setUint16(o,p.length); o+=2; out.set(p,o); o+=p.length; });
  return out;
}
/* Demux the MP4 with mp4box. Returns config + lightweight per-sample
   metadata (offset/size/timestamp into the file buffer — no big copies). */
function demuxMP4(buf){
  return new Promise((resolve,reject)=>{
    let box;
    try{ box=MP4Box.createFile(); }catch(e){ reject(e); return; }
    const to=setTimeout(()=>{ try{box.stop();}catch(_){} reject(new Error('demux timeout')); },45000);
    box.onError=e=>{ clearTimeout(to); reject(new Error('demux: '+((e&&e.message)||e))); };
    box.onReady=info=>{
      try{
        const vt=(info.videoTracks||[])[0];
        if(!vt) throw new Error('no video track in file');
        const trak=(box.moov.traks||[]).find(t=>t.tkhd&&t.tkhd.track_id===vt.id);
        const entry=trak&&trak.mdia.minf.stbl.stsd.entries.find(e=>e.avcC||e.hvcC);
        if(!entry||!entry.avcC) throw new Error('only H.264 (AVC) inputs are supported by the new engine ('+(vt.codec||'unknown')+')');
        const desc=buildAvcCDesc(entry.avcC);
        const samples=box.getTrackSamplesInfo(vt.id)||[];
        if(!samples.length) throw new Error('no video samples found');
        const ts=vt.timescale||90000;
        const list=samples.map(s=>({
          tsUs:Math.max(0,Math.round(s.cts*1e6/ts)),
          durUs:Math.max(1,Math.round(s.duration*1e6/ts)),
          key:!!s.is_sync,
          offset:s.offset, size:s.size
        }));
        let durationUs=Math.round((info.duration||0)*1000);
        const lastEnd=list[list.length-1].tsUs+list[list.length-1].durUs;
        if(lastEnd>durationUs) durationUs=lastEnd;
        clearTimeout(to);
        try{ box.stop(); }catch(_){}
        resolve({ codec:vt.codec, desc, w:vt.video.width, h:vt.video.height,
                  samples:list, durationUs,
                  hasAudio:((info.audioTracks||[]).length>0) });
      }catch(e){ clearTimeout(to); reject(e); }
    };
    try{
      const b=buf.slice(0); b.fileStart=0;
      box.appendBuffer(b);
      box.flush();
    }catch(e){ clearTimeout(to); reject(e); }
  });
}
/* Draw one decoded VideoFrame through the LUT shader onto the export canvas. */
function drawDecoderFrame(frame){
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,texV);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,frame);
  gl.uniform1f(U.intensity,intensity);
  gl.uniform1f(U.bypass,0);
  gl.uniform1f(U.splitX,-1); // no before/after split in exports
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.flush();
}
const sleepMs=ms=>new Promise(r=>setTimeout(r,ms));
async function exportDecoder(resW,resH,videoBps,targetFps){
  let muxer=null,target=null,videoEnc=null,audioEnc=null,decoder=null;
  let done=false,finalized=false,wl=null;
  const holdWake=()=>{ try{ navigator.wakeLock.request('screen').then(w=>{wl=w;}).catch(()=>{}); }catch(e){} };
  const cleanup=()=>{
    document.removeEventListener('visibilitychange',onHide);
    exporting=false; wcActive=false;
    try{if(wl)wl.release();}catch(e){}
    try{if(decoder&&decoder.state!=='closed')decoder.close();}catch(e){}
    try{if(videoEnc&&videoEnc.state!=='closed')videoEnc.close();}catch(e){}
    try{if(audioEnc&&audioEnc.state!=='closed')audioEnc.close();}catch(e){}
  };
  const onHide=()=>{ if(!done) fail(new Error('Tab was hidden — export stopped. Keep this tab open and try again.')); };
  const fail=e=>{ if(done)return; done=true; cleanup(); throw(e instanceof Error?e:new Error(String(e))); };
  if(!videoFile) throw new Error('no video loaded');
  holdWake();
  exporting=true; wcActive=true; // pause the preview rAF loop
  document.addEventListener('visibilitychange',onHide);
  $('prog').hidden=false; setProg(0);
  msg('⚡ New engine: reading video… 0%');

  /* --- 1. file bytes + demux (exact per-sample timestamps) --- */
  const fileBuf=await videoFile.arrayBuffer();
  const dm=await demuxMP4(fileBuf).catch(e=>fail(e));
  const samples=dm.samples, total=samples.length;
  const durMap=new Map(), keyTs=new Set();
  samples.forEach(s=>{ durMap.set(s.tsUs,s.durUs); if(s.key)keyTs.add(s.tsUs); });
  setProg(4); msg('⚡ New engine: decoding '+total+' frames… 4%');

  /* --- 2. muxer --- */
  target=new window.Mp4Muxer.ArrayBufferTarget();
  const mopts={target, video:{codec:'avc',width:resW,height:resH},
    fastStart:'in-memory', firstTimestampBehavior:'offset'};
  let wantAudio=false,aSampleRate=0,aChannels=0,audioBuf=null;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    const actx=new AC();
    try{ audioBuf=await actx.decodeAudioData(fileBuf.slice(0)); }catch(e){ audioBuf=null; }
    try{ actx.close(); }catch(e){}
  }catch(e){ audioBuf=null; }
  if(audioBuf){
    aSampleRate=audioBuf.sampleRate; aChannels=audioBuf.numberOfChannels;
    try{
      const s=await AudioEncoder.isConfigSupported({codec:'mp4a.40.2',sampleRate:aSampleRate,numberOfChannels:aChannels,bitrate:128000});
      if(s&&s.supported){ mopts.audio={codec:'aac',sampleRate:aSampleRate,numberOfChannels:aChannels}; wantAudio=true; }
    }catch(e){}
  }
  muxer=new window.Mp4Muxer.Muxer(mopts);
  if(dm.hasAudio&&!wantAudio) fail(new Error('no AAC encoder in this browser'));

  /* --- 3. video encoder --- */
  const codec=await pickAvcCodec(resW,resH);
  videoEnc=new VideoEncoder({
    output:(ch,meta)=>{ if(!finalized){ try{ muxer.addVideoChunk(ch,meta); }catch(e){ fail(e); } } },
    error:e=>fail(e)
  });
  videoEnc.configure({codec,width:resW,height:resH,
    bitrate:Math.max(800000,Math.round(videoBps)),bitrateMode:'constant',
    framerate:30, latencyMode:'realtime'});

  /* --- 4. audio encoder: feed PCM decoded from the file --- */
  if(wantAudio){
    audioEnc=new AudioEncoder({
      output:(ch,meta)=>{ if(!finalized){ try{ muxer.addAudioChunk(ch,meta); }catch(e){} } },
      error:()=>{}
    });
    audioEnc.configure({codec:'mp4a.40.2',sampleRate:aSampleRate,numberOfChannels:aChannels,bitrate:128000});
    const ch0=audioBuf.getChannelData(0), chN=aChannels>1?audioBuf.getChannelData(1):null;
    const per=1024; let tUs=0;
    for(let o=0;o<ch0.length;o+=per){
      const n=Math.min(per,ch0.length-o);
      const pcm=new Float32Array(n*aChannels);
      for(let i=0;i<n;i++){ pcm[i*aChannels]=ch0[o+i]; if(chN)pcm[i*aChannels+1]=chN[o+i]; }
      const ad=new AudioData({format:'f32-planar',sampleRate:aSampleRate,numberOfFrames:n,
        numberOfChannels:aChannels, timestamp:tUs, data:pcm.buffer});
      while(audioEnc.encodeQueueSize>32) await sleepMs(10);
      try{ audioEnc.encode(ad); }catch(e){}
      try{ ad.close(); }catch(e){}
      tUs+=Math.round(1e6*n/aSampleRate);
    }
  }

  /* --- 5. decoder: pump chunks in; consume frames in presentation order --- */
  canvas.width=resW; canvas.height=resH;
  let decErr=null;
  const frameQ=[], waiters=[];
  decoder=new VideoDecoder({
    output:f=>{ const w=waiters.shift(); if(w)w.res(f); else frameQ.push(f); },
    error:e=>{ decErr=e; let w; while((w=waiters.shift()))w.rej(e); }
  });
  try{
    const cfg={codec:dm.codec,
      description:dm.desc.buffer.slice(dm.desc.byteOffset,dm.desc.byteOffset+dm.desc.byteLength),
      codedWidth:dm.w, codedHeight:dm.h};
    const sup=await VideoDecoder.isConfigSupported(cfg).catch(()=>null);
    if(sup&&!sup.supported) throw new Error('decoder does not support this video');
    decoder.configure(cfg);
  }catch(e){ fail(e instanceof Error?e:new Error('decoder setup failed: '+e)); }
  const nextFrame=async()=>{
    if(frameQ.length) return frameQ.shift();
    if(decErr) throw decErr;
    return new Promise((res,rej)=>waiters.push({res,rej}));
  };
  const fileU8=new Uint8Array(fileBuf);
  const pump=(async()=>{
    for(let i=0;i<total;i++){
      const s=samples[i];
      while(decoder.decodeQueueSize>16) await sleepMs(10);
      decoder.decode(new EncodedVideoChunk({type:s.key?'key':'delta',
        timestamp:s.tsUs, duration:s.durUs, data:fileU8.subarray(s.offset,s.offset+s.size)}));
    }
    await decoder.flush();
  })().catch(e=>{ decErr=e; let w; while((w=waiters.shift()))w.rej(e); });

  let processed=0,lastPct=4;
  const outFps=targetFps||0, outDur=outFps?Math.round(1e6/outFps):0;
  let nextOutTs=0, outCount=0;
  const kfEvery=Math.max(1,Math.round(outFps||30));
  const encodeAt=(ts,isKey)=>{
    const vf=new VideoFrame(canvas,{timestamp:ts,
      duration:outDur||durMap.get(ts)||Math.round(1e6/30)});
    try{ videoEnc.encode(vf,{keyFrame:isKey}); }
    catch(e){ try{vf.close();}catch(_){} throw e; }
    try{ vf.close(); }catch(_){}
    outCount++;
  };
  try{
    while(processed<total){
      const frame=await nextFrame();
      try{
        drawDecoderFrame(frame);
        while(videoEnc.encodeQueueSize>4) await sleepMs(8);
        if(!outFps){
          encodeAt(frame.timestamp, keyTs.has(frame.timestamp));
        }else{
          while(frame.timestamp>=nextOutTs){
            encodeAt(nextOutTs, outCount%kfEvery===0);
            nextOutTs+=outDur;
          }
        }
      }finally{ try{ frame.close(); }catch(_){} }
      processed++;
      const pct=4+Math.round(processed/total*90);
      if(pct!==lastPct){ lastPct=pct; setProg(pct); msg('⚡ New engine: rendering… '+pct+'%'); }
    }
    // tail: fill any remaining output ticks with the last drawn frame
    if(outFps){
      const lastS=samples[total-1], totalDur=lastS.tsUs+(lastS.durUs||outDur);
      while(nextOutTs<=totalDur){
        while(videoEnc.encodeQueueSize>4) await sleepMs(8);
        encodeAt(nextOutTs, outCount%kfEvery===0);
        nextOutTs+=outDur;
      }
    }
  }catch(e){ fail(e); }
  await pump;
  if(decErr) fail(decErr);
  try{ decoder.close(); }catch(e){}
  decoder=null;

  /* --- 6. flush encoders, finalize --- */
  done=true;
  setProg(97); msg('⚡ New engine: finalizing… 97%');
  try{ await videoEnc.flush(); }catch(e){}
  try{ if(audioEnc) await audioEnc.flush(); }catch(e){}
  let blob=null;
  try{ finalized=true; muxer.finalize(); blob=new Blob([target.buffer],{type:'video/mp4'}); }
  catch(e){ cleanup(); throw e; }
  cleanup();
  setProg(100);
  if(!blob||!blob.size) throw new Error('encoder produced no data');
  return blob;
}

/* ============================================================
   EXPORT — WebCodecs pipeline (primary for MP4/H.264)
   Video: VideoFrame(canvas) -> VideoEncoder(H.264, exact bitrate)
          -> mp4-muxer. Audio: MediaStreamTrackProcessor ->
          AudioEncoder(AAC) -> mp4-muxer. Precise timestamps,
          no more bitrate guessing, AAC audio plays on iPhone.
   ============================================================ */
function canUseWebCodecs(){
  try{
    return typeof VideoEncoder!=='undefined'&&typeof VideoFrame!=='undefined'
      &&typeof AudioEncoder!=='undefined'&&typeof MediaStreamTrackProcessor!=='undefined'
      &&!!(window.Mp4Muxer&&window.Mp4Muxer.Muxer);
  }catch(e){return false;}
}
async function pickAvcCodec(w,h){
  // Use max dimension so portrait (e.g. 1080x1920) gets the same level as landscape 1920x1080.
  // Old code checked w/h separately and gave portrait 1080p Level 5.1 (4K tier),
  // which Android hardware encoders reject -> "encoder error".
  // Prefer Baseline (42) over High (64): universally supported, negligible quality diff for LUT work.
  const m=Math.max(w,h);
  const lvl=m<=1280?'1f':m<=1920?'28':m<=2560?'32':'33';
  for(const c of ['avc1.4200'+lvl,'avc1.6400'+lvl]){
    try{
      const s=await VideoEncoder.isConfigSupported({codec:c,width:w,height:h,bitrate:2e6,framerate:30});
      if(s&&s.supported)return c;
    }catch(e){}
  }
  return 'avc1.420028'; // Baseline Level 4.0: safest universal fallback
}
function seekTo(t){
  return new Promise(res=>{
    if(Math.abs(videoEl.currentTime-t)<0.04){res();return;}
    const to=setTimeout(res,1500);
    videoEl.addEventListener('seeked',()=>{clearTimeout(to);res();},{once:true});
    try{videoEl.currentTime=t;}catch(e){clearTimeout(to);res();}
  });
}
/* ============================================================
   OFFLINE EXPORT — frame-by-frame, not real-time.
   Seeks through the video and encodes each frame with exact timestamps.
   Slower than real-time but bulletproof: output is smooth on any device,
   regardless of encoder speed. Audio decoded directly from the file.
   ============================================================ */
async function exportOffline(resW,resH,targetFps,videoBps){

async function exportLegacy(){

    $('newVidBtn').onclick=()=>{ $('dlZone').innerHTML=''; $('uploadCard').hidden=false; $('studio').hidden=true; if(videoEl.src)URL.revokeObjectURL(videoEl.src); videoEl.removeAttribute('src'); videoEl.load(); };
    msg('Done — '+lab+' '+resW+'×'+resH+' saved ✓ ('+mb+' MB)','ok');
  }catch(e){
    const em=e.message||String(e);
    let hint='';
    if(/encoder|encode|codec|mime/i.test(em)) hint=' — try Size: 1080p or Format: HEVC';
    msg('Export failed: '+em+hint,'err');
  }
  exporting=false; $('expBtn').disabled=false; videoEl.onended=null;
  $('renderOverlay').hidden=true;
};



/* Default LUTs: fetched from luts/ folder on first run */
const DEFAULT_LUT_FILES=[
  'Cine_wedding.cube','Cinematic_Lut_V2.cube','SONY_HL.cube',
  'Sony-CL-AZ.cube','FGCineVibrant.cube',
  'sony_lut_1.Animals_09___4K_res.cube','lut_1.rabbit-5639615.cube','Apple-Log_XZ1.cube'
];
async function loadDefaultLuts(){
  for(const fname of DEFAULT_LUT_FILES){
    try{
      const name=fname.replace(/\.cube$/i,'');
      if(luts.some(l=>l.name===name||l.name===fname)) continue;
      const resp=await fetch('luts/'+fname);
      if(!resp.ok) continue;
      const text=await resp.text();
      const lut=parseCube(text);
      luts.push({name:fname,lut:lut});
      try{ if(typeof DB!=='undefined'&&DB) DB.put({name:fname,text:text}); }catch(e){}
    }catch(e){}
  }
  renderLuts();
}
/* ---------- restore saved LUTs ---------- */
(async()=>{
  renderLuts();
  if(await DB.open()){
    const saved=await DB.all();
    for(const s of saved){
      try{luts.push({name:s.name,lut:parseCube(s.text)});}catch(e){DB.del(s.name);}
    }
    if(luts.length)renderLuts();
  }else{
    $('lutHint').textContent='LUTs work for this session on this device';
  }
  // Load built-in default LUTs (first run)
  loadDefaultLuts();
})();
</script>
