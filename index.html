<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Reshi LUT Studio — Your LUTs on Any Video</title>
<meta name="description" content="Upload any video, add your own .cube LUTs, tap to try different looks. Works on iPhone, Android and PC. Everything stays on your device."/>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:#0b1226; color:#eef2ff; min-height:100vh; touch-action:manipulation}
  .wrap{max-width:640px; margin:0 auto; padding:0 16px 60px}
  header{padding:22px 0 6px; text-align:center}
  header h1{margin:0; font-size:1.5rem}
  header h1 .g{background:linear-gradient(90deg,#8b5cf6,#ec4899); -webkit-background-clip:text; background-clip:text; color:transparent}
  header p{margin:6px 0 0; color:#9aa6c4; font-size:.85rem}
  .card{background:rgba(20,28,52,.8); border:1px solid rgba(255,255,255,.08); border-radius:16px;
    padding:18px; margin-top:16px}
  .bigbtn{display:block; width:100%; padding:18px; font-size:1.1rem; font-weight:800; color:#fff; border:0;
    border-radius:14px; cursor:pointer; background:linear-gradient(90deg,#8b5cf6,#ec4899)}
  .bigbtn:active{transform:scale(.98)}
  .ghostbtn{display:block; width:100%; padding:14px; font-size:1rem; font-weight:700; color:#eef2ff; cursor:pointer;
    border-radius:14px; border:1px dashed #3b4770; background:transparent; margin-top:10px}
  .hint{color:#9aa6c4; font-size:.78rem; text-align:center; margin:10px 0 0}
  h2{font-size:1rem; margin:18px 0 10px; color:#cdd6f4}
  canvas#gl{width:100%; height:auto; border-radius:12px; background:#000; display:block}
  .trow{display:flex; align-items:center; gap:10px; margin-top:10px}
  .trow button{flex:0 0 auto; width:52px; height:44px; font-size:1.2rem; border-radius:12px; border:1px solid #3b4770;
    background:#141c38; color:#fff; cursor:pointer}
  input[type=range]{flex:1; accent-color:#8b5cf6; height:32px}
  #chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{display:inline-flex; align-items:center; gap:6px; padding:10px 14px; border-radius:999px; cursor:pointer;
    border:1px solid #3b4770; background:#141c38; color:#eef2ff; font-size:.9rem; font-weight:600}
  .chip.active{background:linear-gradient(90deg,#8b5cf6,#ec4899); border-color:transparent; color:#fff}
  .chip .x{display:inline-flex; width:20px; height:20px; border-radius:50%; background:rgba(255,255,255,.18);
    align-items:center; justify-content:center; font-size:.8rem; line-height:1}
  .srow{display:flex; align-items:center; gap:10px; margin-top:14px}
  .srow label{flex:0 0 auto; font-size:.85rem; color:#9aa6c4}
  #cmpBtn{user-select:none; -webkit-user-select:none}
  #prog{height:10px; background:#141c38; border-radius:99px; margin-top:12px; overflow:hidden}
  #bar{height:100%; width:0%; background:linear-gradient(90deg,#8b5cf6,#ec4899); border-radius:99px}
  #msg{font-size:.85rem; min-height:1.2em; margin:10px 0 0; color:#9aa6c4}
  #msg.ok{color:#4ade80} #msg.err{color:#f87171}
  .dl{display:inline-block; margin-top:10px; padding:14px 20px; border-radius:12px; font-weight:800; color:#fff;
    text-decoration:none; background:linear-gradient(90deg,#22c55e,#16a34a)}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎬 Reshi <span class="g">LUT Studio</span></h1>
    <p>Your LUTs on any video — iPhone, Android &amp; PC</p>
  </header>

  <div class="card" id="uploadCard">
    <button class="bigbtn" id="upBtn">📤 Upload video</button>
    <input type="file" id="fileIn" accept="video/*" hidden>
    <p class="hint">MP4 / MOV / WebM — the video never leaves your device</p>
  </div>

  <div class="card" id="studio" hidden>
    <canvas id="gl"></canvas>
    <div class="trow">
      <button id="playBtn" aria-label="Play or pause">▶</button>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
    </div>

    <h2>My LUTs</h2>
    <div id="chips"></div>
    <button class="ghostbtn" id="addLutBtn">＋ Add your LUTs (.cube)</button>
    <input type="file" id="lutIn" accept=".cube,.CUBE" multiple hidden>
    <p class="hint" id="lutHint">Your LUTs stay saved on this device</p>

    <div class="srow">
      <label for="int">Strength</label>
      <input type="range" id="int" min="0" max="100" value="100">
      <label id="intVal">100%</label>
    </div>

    <button class="ghostbtn" id="cmpBtn">👁 Hold to see original</button>
    <button class="bigbtn" id="expBtn" style="margin-top:12px">⬇ Save graded video</button>
    <div id="prog" hidden><div id="bar"></div></div>
    <div id="dlZone"></div>
    <p id="msg"></p>
  </div>
</div>

<video id="v" playsinline webkit-playsinline crossorigin="anonymous" hidden></video>

<script>
'use strict';
const $=id=>document.getElementById(id);
const videoEl=$('v'), canvas=$('gl');
const msg=(t,cls)=>{ const m=$('msg'); m.textContent=t||''; m.className=cls||''; };
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- saved LUTs (stay on the device) ---------- */
const DB={
  db:null,
  open(){return new Promise(res=>{try{
    const r=indexedDB.open('reshi-lut-studio',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('luts',{keyPath:'name'});
    r.onsuccess=()=>{DB.db=r.result;res(true)}; r.onerror=()=>res(false);
  }catch(e){res(false)}})},
  all(){return new Promise(res=>{try{
    const t=DB.db.transaction('luts').objectStore('luts').getAll();
    t.onsuccess=()=>res(t.result||[]); t.onerror=()=>res([]);
  }catch(e){res([])}})},
  put(it){try{DB.db.transaction('luts','readwrite').objectStore('luts').put(it)}catch(e){}},
  del(n){try{DB.db.transaction('luts','readwrite').objectStore('luts').delete(n)}catch(e){}}
};

/* ---------- .cube parsing ---------- */
function parseCube(txt){
  const lines=txt.split(/\r?\n/);
  let n=0; const data=[];
  for(let ln of lines){
    ln=ln.trim();
    if(!ln||ln[0]==='#') continue;
    const p=ln.split(/\s+/), k=p[0].toUpperCase();
    if(k==='LUT_3D_SIZE'){ n=parseInt(p[1],10); if(!(n>=2&&n<=64)) throw new Error('bad size'); }
    else if(k==='TITLE'||k==='DOMAIN_MIN'||k==='DOMAIN_MAX'||k==='LUT_1D_SIZE') continue;
    else{
      if(!n) throw new Error('not a 3D LUT');
      const v=p.slice(0,3).map(Number);
      if(v.length<3||v.some(isNaN)) continue;
      data.push(v[0],v[1],v[2]);
    }
  }
  if(!n||data.length<n*n*n*3) throw new Error('incomplete LUT');
  return {n, data:Float32Array.from(data)};
}

/* ---------- WebGL ---------- */
let gl, texV, texL, U={}, glReady=false, hasLUT=false;
let intensity=1, showOrig=false, active='__orig', origBps=0, origSize=0;
const luts=[]; // {name, lut}

function initGL(){
  gl=canvas.getContext('webgl',{antialias:false});
  if(!gl) throw new Error('WebGL not available on this device');
  const vs='attribute vec2 p; varying vec2 uv; void main(){uv=p*0.5+0.5; gl_Position=vec4(p,0.,1.);}';
  const fs=['precision mediump float; varying vec2 uv;',
    'uniform sampler2D videoTex,lutTex; uniform float lutN,intensity,useLUT,bypass;',
    'vec3 applyLUT(vec3 c){',
    ' vec3 s=clamp(c,0.,1.)*(lutN-1.);',
    ' float b0=floor(s.b),b1=min(b0+1.,lutN-1.);',
    ' vec2 tsz=vec2(lutN,lutN*lutN);',
    ' vec3 c0=texture2D(lutTex,(vec2(s.r,s.g+b0*lutN)+.5)/tsz).rgb;',
    ' vec3 c1=texture2D(lutTex,(vec2(s.r,s.g+b1*lutN)+.5)/tsz).rgb;',
    ' return mix(c0,c1,fract(s.b));}',
    'void main(){ vec3 c=texture2D(videoTex,vec2(uv.x,1.-uv.y)).rgb;',
    ' vec3 g=useLUT>.5?applyLUT(c):c;',
    ' vec3 fin=mix(c,g,intensity*(1.-bypass));',
    ' gl_FragColor=vec4(fin,1.);}'].join('\n');
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error('shader: '+gl.getShaderInfoLog(o));return o};
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) throw new Error('GL link failed');
  gl.useProgram(pr);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const mkTex=()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t};
  texV=mkTex(); texL=mkTex();
  gl.uniform1i(gl.getUniformLocation(pr,'videoTex'),0);
  gl.uniform1i(gl.getUniformLocation(pr,'lutTex'),1);
  ['lutN','intensity','useLUT','bypass'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
  gl.uniform1f(U.intensity,1); gl.uniform1f(U.useLUT,0); gl.uniform1f(U.bypass,0);
  glReady=true;
  (function loop(){ draw(); requestAnimationFrame(loop); })();
}
function uploadLUT(lut){
  const n=lut.n, bytes=new Uint8Array(n*n*n*4);
  const d=lut.data;
  for(let i=0;i<n*n*n;i++){
    bytes[i*4]=Math.max(0,Math.min(255,Math.round(d[i*3]*255)));
    bytes[i*4+1]=Math.max(0,Math.min(255,Math.round(d[i*3+1]*255)));
    bytes[i*4+2]=Math.max(0,Math.min(255,Math.round(d[i*3+2]*255)));
    bytes[i*4+3]=255;
  }
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,texL);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,n,n*n,0,gl.RGBA,gl.UNSIGNED_BYTE,bytes);
  gl.uniform1f(U.lutN,n); gl.uniform1f(U.useLUT,1); hasLUT=true;
}
function draw(){
  if(!glReady||!videoEl.videoWidth) return;
  if(canvas.width!==videoEl.videoWidth){canvas.width=videoEl.videoWidth;canvas.height=videoEl.videoHeight;}
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,texV);
  try{gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,videoEl);}catch(e){return;}
  gl.uniform1f(U.intensity,intensity);
  gl.uniform1f(U.bypass,showOrig?1:0);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ---------- LUT chips ---------- */
function renderChips(){
  const box=$('chips'); box.innerHTML='';
  const mk=(id,label,removable)=>{
    const b=document.createElement('button');
    b.className='chip'+(active===id?' active':'');
    b.innerHTML='<span>'+esc(label)+'</span>'+(removable?'<span class="x" data-x="'+esc(id)+'">×</span>':'');
    b.onclick=e=>{
      const x=e.target.getAttribute&&e.target.getAttribute('data-x');
      if(x){removeLUT(x);return;}
      selectLUT(id);
    };
    box.appendChild(b);
  };
  mk('__orig','Original',false);
  luts.forEach(l=>mk(l.name,l.name.replace(/\.cube$/i,''),true));
}
function selectLUT(id){
  active=id;
  if(id==='__orig'){hasLUT=false; if(glReady)gl.uniform1f(U.useLUT,0);}
  else{const f=luts.find(l=>l.name===id); if(f&&glReady)uploadLUT(f.lut);}
  renderChips();
}
function removeLUT(name){
  const i=luts.findIndex(l=>l.name===name);
  if(i>=0)luts.splice(i,1);
  DB.del(name);
  if(active===name)selectLUT('__orig'); else renderChips();
}
async function addLUTFiles(files){
  let ok=0;
  for(const f of files){
    try{
      const txt=await f.text();
      const lut=parseCube(txt);
      const name=f.name;
      const i=luts.findIndex(l=>l.name===name);
      const rec={name,lut};
      if(i>=0)luts[i]=rec; else luts.push(rec);
      DB.put({name,text:txt});
      ok++;
    }catch(e){msg('Skipped '+f.name+': not a valid .cube','err');}
  }
  if(ok){selectLUT(luts[luts.length-1].name); msg(ok+' LUT'+(ok>1?'s':'')+' added ✓','ok');}
  renderChips();
}

/* ---------- upload video ---------- */
$('upBtn').onclick=()=>$('fileIn').click();
$('fileIn').onchange=e=>{if(e.target.files[0])loadVideo(e.target.files[0]); e.target.value='';};
$('addLutBtn').onclick=()=>$('lutIn').click();
$('lutIn').onchange=e=>{if(e.target.files.length)addLUTFiles([...e.target.files]); e.target.value='';};

function loadVideo(f){
  msg('');
  try{ if(!glReady)initGL(); }
  catch(e){ msg(e.message,'err'); return; }
  if(videoEl.src)URL.revokeObjectURL(videoEl.src);
  videoEl.src=URL.createObjectURL(f);
  videoEl.load();
  videoEl.onloadedmetadata=()=>{
    $('uploadCard').hidden=true; $('studio').hidden=false;
    canvas.width=videoEl.videoWidth; canvas.height=videoEl.videoHeight;
    origBps=(videoEl.duration>0&&f.size>0)?(f.size*8/videoEl.duration):0; // original bitrate → export matches it
    origSize=f.size||0;
    selectLUT(active);
    videoEl.play().catch(()=>{});
    msg('Tap a LUT to try it 👇');
  };
  videoEl.onerror=()=>msg('Could not play this video on your device','err');
}
$('playBtn').onclick=()=>{videoEl.paused?videoEl.play():videoEl.pause();};
videoEl.onplay=()=>$('playBtn').textContent='⏸';
videoEl.onpause=()=>$('playBtn').textContent='▶';
videoEl.ontimeupdate=()=>{
  if(videoEl.duration)$('seek').value=Math.round(videoEl.currentTime/videoEl.duration*1000);
  if(exporting&&videoEl.duration)$('bar').style.width=(videoEl.currentTime/videoEl.duration*100)+'%';
};
$('seek').oninput=e=>{if(videoEl.duration)videoEl.currentTime=e.target.value/1000*videoEl.duration;};
$('int').oninput=e=>{intensity=e.target.value/100;$('intVal').textContent=e.target.value+'%';};

/* hold-to-compare */
const cmp=$('cmpBtn');
const cmpOn=e=>{e.preventDefault();showOrig=true;};
const cmpOff=()=>{showOrig=false;};
cmp.addEventListener('pointerdown',cmpOn);
['pointerup','pointerleave','pointercancel'].forEach(ev=>cmp.addEventListener(ev,cmpOff));
cmp.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- export ---------- */
let exporting=false, actx=null, mediaSrc=null;
function encCandidates(){
  const list=[['video/mp4','mp4','MP4'],['video/webm;codecs=h264','webm','WebM'],
    ['video/webm;codecs=vp9','webm','WebM'],['video/webm;codecs=vp8','webm','WebM'],['video/webm','webm','WebM']];
  return list.filter(([m])=>{try{return window.MediaRecorder&&MediaRecorder.isTypeSupported(m)}catch(e){return false}});
}
function renderPass(stream,mime,bps){
  return new Promise((resolve,reject)=>{
    const chunks=[];
    const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:bps});
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    let done=false;
    const finish=()=>{if(done)return;done=true;try{rec.stop();}catch(e){}};
    rec.onstop=()=>{done=true;resolve(chunks);};
    rec.onerror=()=>{done=true;reject(new Error('encoder error'));};
    videoEl.onended=finish;
    setTimeout(()=>{if(rec.state==='recording')finish();},(videoEl.duration||60)*1000+8000);
    msg('Rendering at original quality ('+(bps/1000000).toFixed(1)+' Mbps)… 0%'); $('prog').hidden=false; $('bar').style.width='0%';
    videoEl.currentTime=0;
    rec.start(250);
    videoEl.play().catch(reject);
    const tick=()=>{if(!done&&videoEl.duration)msg('Rendering at '+(bps/1000000).toFixed(1)+' Mbps… '+Math.round(videoEl.currentTime/videoEl.duration*100)+'%');};
    videoEl.addEventListener('timeupdate',tick);
  });
}
$('expBtn').onclick=async()=>{
  if(exporting||!videoEl.videoWidth)return;
  exporting=true; $('expBtn').disabled=true; $('dlZone').innerHTML='';
  try{
    let audioTracks=[];
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended')await actx.resume();
      if(!mediaSrc)mediaSrc=actx.createMediaElementSource(videoEl);
      const dest=actx.createMediaStreamDestination();
      try{mediaSrc.disconnect();}catch(e){}
      mediaSrc.connect(dest);
      audioTracks=dest.stream.getAudioTracks();
    }catch(e){}
    const stream=new MediaStream([...canvas.captureStream(30).getVideoTracks(),...audioTracks]);
    // match the ORIGINAL video's bitrate exactly → same size & quality
    const bps=origBps>0?Math.min(120000000,Math.round(origBps)):Math.round(canvas.width*canvas.height*30*0.08);
    const cands=encCandidates();
    if(!cands.length)throw new Error('no video encoder in this browser');
    // Some browsers (Chrome's MP4 recorder) ignore the requested bitrate and return a tiny file.
    // So: render with each encoder, keep the first whose size is close to the original; else keep the biggest.
    const expectedMin=origSize>0?origSize*0.6:0;
    let blob=null, ext='webm', lab='WebM', best=null;
    for(const [mime,e,l] of cands){
      const chunks=await renderPass(stream,mime,bps);
      videoEl.pause();
      const b=new Blob(chunks,{type:mime.split(';')[0]});
      if(b.size&&(!best||b.size>best.blob.size))best={blob:b,ext:e,lab:l};
      if(b.size>=expectedMin&&expectedMin>0){blob=b;ext=e;lab=l;break;}
      if(!expectedMin&&b.size){blob=b;ext=e;lab=l;break;}
      msg(l+' came out too small — trying a better encoder…');
    }
    if(!blob){ if(!best)throw new Error('encoder produced no data'); blob=best.blob;ext=best.ext;lab=best.lab; }
    const mb=(blob.size/1048576).toFixed(1);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='reshi-graded-'+Date.now()+'.'+ext;
    a.className='dl';
    a.textContent='⬇ Download '+ext.toUpperCase()+' ('+mb+' MB)';
    $('dlZone').appendChild(a); a.click();
    msg('Done — '+lab+' saved ✓ ('+mb+' MB)','ok');
  }catch(e){msg('Export failed: '+e.message,'err');}
  exporting=false; $('expBtn').disabled=false; videoEl.onended=null;
};

/* ---------- restore saved LUTs ---------- */
(async()=>{
  renderChips();
  if(await DB.open()){
    const saved=await DB.all();
    for(const s of saved){
      try{luts.push({name:s.name,lut:parseCube(s.text)});}catch(e){DB.del(s.name);}
    }
    if(luts.length)renderChips();
  }else{
    $('lutHint').textContent='LUTs work for this session on this device';
  }
})();
</script>
</body>
</html>
